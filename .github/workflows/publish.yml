name: Documentación automática (GitHub Pages)

# Se dispara desde el backend (release) vía repository_dispatch, o manualmente.
on:
  repository_dispatch:
    types: [api-released]
  workflow_dispatch:
    inputs:
      backend_repo:
        description: 'Repositorio del backend (owner/repo)'
        required: false
      backend_ref:
        description: 'Rama/tag del backend a leer'
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BACKEND_REPO: ${{ inputs.backend_repo || vars.BACKEND_REPO || 'alpac-organization/ERP.Core.Manager.Api' }}
  BACKEND_DOCS_PATH: ${{ vars.BACKEND_DOCS_PATH || 'src/ERP.Core.Manager.Api/Docs' }}
  BACKEND_REF: ${{ inputs.backend_ref || vars.BACKEND_REF || 'develop' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Descargar Docs desde el backend (solo .md existentes)
        id: fetch-docs
        run: |
          TOKEN="${BACKEND_READ_TOKEN:-$GITHUB_TOKEN}"
          node scripts/fetch-backend-docs.mjs \
            --repo="$BACKEND_REPO" \
            --path="$BACKEND_DOCS_PATH" \
            --ref="$BACKEND_REF" \
            --token="$TOKEN"
        env:
          BACKEND_READ_TOKEN: ${{ secrets.BACKEND_READ_TOKEN }}

      - name: Sincronizar documentos al sitio
        if: success()
        run: npm run docs:sync

      - name: Build del sitio
        if: success()
        run: npm run build

      - name: Configurar GitHub Pages
        if: success()
        uses: actions/configure-pages@v5

      - name: Subir artefacto de páginas
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Desplegar a GitHub Pages
        id: deployment
        if: success()
        uses: actions/deploy-pages@v4
