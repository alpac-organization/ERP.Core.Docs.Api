name: Publicar documentación

on:
  repository_dispatch:
    types: [api-released]
  workflow_dispatch:
    inputs:
      spec_url:
        description: 'URL del OpenAPI Spec (opcional)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download OpenAPI spec
        id: download-spec
        run: |
          # 1) Fuente preferida: input del workflow_dispatch.
          URL="${{ inputs.spec_url }}"
          # 2) Si no viene, usar la variable de entorno del repo.
          if [ -z "$URL" ]; then URL="${OPENAPI_SPEC_URL:-}"; fi
          if [ -z "$URL" ]; then
            echo "::error::No se pudo obtener el spec. Define 'spec_url' (o OPENAPI_SPEC_URL en settings)."
            exit 1
          fi
          echo "spec_url=$URL" >> "$GITHUB_OUTPUT"
          curl -sS "$URL" -o swagger.local.json
          ls -la swagger.local.json

      - name: Generate markdown
        run: npm run generate:docs -- --spec=./swagger.local.json

      - name: Build site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
