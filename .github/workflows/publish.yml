name: Documentación automática (GitHub Pages)

# Se dispara desde los backends (release) vía repository_dispatch, o manualmente.
on:
  repository_dispatch:
    types: [api-released]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Descargar Docs desde los backends (solo .md existentes)
        run: |
          # Si la release llega con ref/repo, se usa para la fuente que coincida.
          if [ -n "$REF_PAYLOAD" ] && [ -n "$REPO_PAYLOAD" ]; then
            OVERRIDES=$(node -e "console.log(JSON.stringify({['$REPO_PAYLOAD']:'$REF_PAYLOAD'}))")
          else
            OVERRIDES='{}'
          fi
          node scripts/fetch-backend-docs.mjs \
            --config=./docs.config.json \
            --token="$BACKEND_READ_TOKEN" \
            --repo-ref-overrides="$OVERRIDES"
        env:
          BACKEND_READ_TOKEN: ${{ secrets.BACKEND_READ_TOKEN }}
          REPO_PAYLOAD: ${{ github.event.client_payload.repo }}
          REF_PAYLOAD: ${{ github.event.client_payload.ref }}

      - name: Sincronizar documentos al sitio
        if: success()
        run: npm run docs:sync

      - name: Build del sitio
        if: success()
        run: npm run build

      - name: Configurar GitHub Pages
        if: success()
        uses: actions/configure-pages@v5

      - name: Subir artefacto de páginas
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Desplegar a GitHub Pages
        id: deployment
        if: success()
        uses: actions/deploy-pages@v4
